name: GangBaoKicks
options:
  bundleIdPrefix: com.gangbao
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "0.1.0"
    DEVELOPMENT_TEAM: ""
packages: {}
schemes:
  GangBaoKicks:
    build:
      targets:
        GangBaoKicks: all
  GangBaoKicks Watch App:
    build:
      targets:
        GangBaoKicks Watch App: all
targets:
  GangBaoKicks:
    type: application
    platform: iOS
    sources:
      - path: Apps/iOS
      - path: Shared
    info:
      path: Apps/iOS/Info.plist
      properties:
        CFBundleDisplayName: GangBaoKicks
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gangbao.GangBaoKicks
        INFOPLIST_KEY_NSUserNotificationsUsageDescription: GangBaoKicks can remind you when it is time to count kicks.
    dependencies:
      - target: GangBaoKicks Watch App
        embed: true

  GangBaoKicks Watch App:
    type: application
    platform: watchOS
    sources:
      - path: Apps/Watch
      - path: Shared
    info:
      path: Apps/Watch/Info.plist
      properties:
        CFBundleDisplayName: GangBaoKicks
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.gangbao.GangBaoKicks
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gangbao.GangBaoKicks.watchkitapp
        INFOPLIST_KEY_NSUserNotificationsUsageDescription: GangBaoKicks can remind you when it is time to count kicks.
